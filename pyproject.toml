[project]
name = "tuya2mqtt"
version = "0.1.0"
description = "Bridge Tuya Wi-Fi devices to MQTT locally with Home Assistant discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tinytuya>=1.16",
    "paho-mqtt>=2.1",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
tuya2mqtt = "tuya2mqtt_local.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"